name: Daily NBA Data Update

on:
  schedule:
    # 北京时间 22:00 对应 UTC 14:00
    - cron: '0 14 * * *'
  workflow_dispatch: # 保留手动触发按钮，方便调试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: |
          pip install pandas lxml html5lib requests

      - name: 运行抓取脚本
        run: python fetch_nba_data.py

      - name: 提交并推送到 GitHub
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add nba_rookies_*.csv
          git commit -m "每日更新: 2024-2026 新秀数据 ($(date))" || exit 0
          git push
